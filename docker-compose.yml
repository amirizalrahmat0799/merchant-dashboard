# Runs the dashboard next to the payment-gateway-sim stack.
# Start the gateway first (from its repo):  docker compose up -d
# Then from this repo:                      docker compose up --build
# Open http://localhost:3000
services:
  dashboard:
    build: .
    # environment:
    #   ASSISTANT_SERVICE_URL: http://assistant:8085   # enable when payment-assistant is running
    ports:
      - "3000:8080"
    networks:
      - gateway

networks:
  gateway:
    name: payment-gateway-sim_default
    external: true
